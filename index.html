<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211832">
  <title>Skybound - ちいさな冒険</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #211832;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, #392544 0, #211832 55%, #151526 100%);
    }

    main { width: min(100%, 960px); }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin: 0 2px 14px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #e4b567;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2rem);
      letter-spacing: -.04em;
    }

    .hint {
      margin: 0;
      color: #c9b8a2;
      font-size: .85rem;
      text-align: right;
    }

    .game-shell {
      position: relative;
      overflow: hidden;
      border: 4px solid #e4b567;
      border-radius: 0;
      background: #211832;
      box-shadow: 0 0 0 4px #151526, 8px 8px 0 #0d0d18;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      touch-action: none;
    }

    .hud {
      position: absolute;
      inset: 14px 16px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      color: #fff0c2;
      font-size: .78rem;
      font-weight: 800;
      text-shadow: 2px 2px #151526;
    }

    .hud span {
      padding: 7px 11px;
      border: 2px solid #e4b567;
      border-radius: 0;
      background: #211832;
      box-shadow: 3px 3px 0 #0d0d18;
    }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #151526dd;
      text-align: center;
    }

    .message[hidden] { display: none; }

    .card {
      max-width: 360px;
      padding: 25px 28px;
      border: 4px solid #e4b567;
      border-radius: 0;
      background: #211832;
      box-shadow: 6px 6px 0 #0d0d18;
    }

    .card h2 { margin: 0 0 8px; color: #f6d365; font-size: 1.6rem; text-shadow: 2px 2px #70445a; }
    .card p { margin: 0 0 18px; color: #e3d3bd; line-height: 1.6; }

    button {
      border: 0;
      border-radius: 0;
      padding: 11px 20px;
      background: #f6d365;
      color: #21183a;
      box-shadow: 3px 3px 0 #70445a;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
    }

    button:hover { background: #ffe99a; box-shadow: 3px 3px 0 #70445a; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .mobile-controls {
      display: none;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-group { display: flex; gap: 10px; }
    .mobile-controls button {
      width: 64px;
      height: 54px;
      padding: 0;
      border: 2px solid #e4b567;
      border-radius: 0;
      background: #211832;
      color: white;
      font-size: 1.2rem;
      box-shadow: 3px 3px 0 #0d0d18;
      touch-action: none;
    }

    .mobile-controls button:active { background: #70445a; box-shadow: 1px 1px 0 #0d0d18; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 13px 3px 0;
      color: #b9a88f;
      font-size: .76rem;
    }

    @media (max-width: 650px) {
      body { padding: 18px 12px; }
      .topline { align-items: start; flex-direction: column; gap: 6px; }
      .hint { text-align: left; }
      .mobile-controls { display: flex; }
      .footer { font-size: .69rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topline">
      <div>
        <p class="eyebrow">PIXEL QUEST · 16-BIT ADVENTURE</p>
        <h1>Skybound <span aria-hidden="true">☁️</span></h1>
      </div>
      <p class="hint">敵はジャンプで踏んで倒そう！</p>
    </header>

    <section class="game-shell" aria-label="横スクロールアクションゲーム">
      <canvas id="game" aria-label="Skyboundのゲーム画面"></canvas>
      <div class="hud" aria-live="polite">
        <span id="progress">▶ START</span>
        <span id="lives">♥ ♥ ♥</span>
        <span id="defeats">撃破 0</span>
      </div>
      <div class="message" id="message">
        <div class="card">
          <h2 id="message-title">冒険に出発！</h2>
          <p id="message-text">ジャンプで足場をわたり、敵は上から踏んで倒そう！</p>
          <button id="start-button" type="button">ゲームスタート</button>
        </div>
      </div>
    </section>

    <nav class="mobile-controls" aria-label="タッチ操作">
      <div class="control-group">
        <button type="button" data-key="ArrowLeft" aria-label="左へ">←</button>
        <button type="button" data-key="ArrowRight" aria-label="右へ">→</button>
      </div>
      <button type="button" data-key="Space" aria-label="ジャンプ">↑</button>
    </nav>

    <div class="footer">
      <span>操作: ← → / A D で移動 · Space / ↑ でジャンプ</span>
      <span>敵は上から踏むと撃破 · 横から触れるとライフ減少</span>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const message = document.querySelector("#message");
      const messageTitle = document.querySelector("#message-title");
      const messageText = document.querySelector("#message-text");
      const startButton = document.querySelector("#start-button");
      const progressLabel = document.querySelector("#progress");
      const livesLabel = document.querySelector("#lives");
      const defeatsLabel = document.querySelector("#defeats");

      const worldWidth = 2800;
      const worldHeight = 540;
      const platforms = [
        { x: 0, y: 440, w: 500, h: 100 },
        { x: 590, y: 440, w: 390, h: 100 },
        { x: 1080, y: 440, w: 390, h: 100 },
        { x: 1580, y: 440, w: 410, h: 100 },
        { x: 2110, y: 440, w: 690, h: 100 },
        { x: 250, y: 345, w: 150, h: 22 },
        { x: 720, y: 340, w: 150, h: 22 },
        { x: 1190, y: 335, w: 165, h: 22 },
        { x: 1690, y: 340, w: 150, h: 22 },
        { x: 2220, y: 330, w: 165, h: 22 }
      ];
      const enemySpawns = [
        { x: 360, y: 410, min: 300, max: 465 },
        { x: 805, y: 310, min: 720, max: 850 },
        { x: 1300, y: 410, min: 1130, max: 1410 },
        { x: 1780, y: 310, min: 1690, max: 1810 },
        { x: 2310, y: 300, min: 2220, max: 2360 },
        { x: 2630, y: 410, min: 2460, max: 2730 }
      ];
      const keys = new Set();
      const player = { x: 70, y: 390, w: 30, h: 42, vx: 0, vy: 0, grounded: false };
      let enemies = [];
      let cameraX = 0;
      let lives = 3;
      let running = false;
      let lastTime = 0;
      let elapsed = 0;
      let invulnerable = 0;
      let particles = [];
      let defeats = 0;

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const pixelScale = 3;
        canvas.width = Math.max(1, Math.round(rect.width * dpr / pixelScale));
        canvas.height = Math.max(1, Math.round(rect.height * dpr / pixelScale));
        ctx.setTransform(canvas.width / (rect.width || 1), 0, 0, canvas.height / (rect.height || 1), 0, 0);
        draw();
      }

      function resetGame() {
        player.x = 70;
        player.y = 390;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        cameraX = 0;
        lives = 3;
        invulnerable = 0;
        elapsed = 0;
        particles = [];
        defeats = 0;
        enemies = enemySpawns.map((enemy, index) => ({
          ...enemy,
          x: enemy.x,
          y: enemy.y,
          w: 32,
          h: 30,
          type: index % 3,
          direction: index % 2 === 0 ? 1 : -1
        }));
        updateHud();
      }

      function updateHud() {
        progressLabel.textContent = `${Math.min(100, Math.floor((player.x / (worldWidth - 100)) * 100))}%`;
        livesLabel.textContent = `${"♥ ".repeat(lives)}${"♡ ".repeat(3 - lives)}`.trim();
        defeatsLabel.textContent = `撃破 ${defeats}`;
      }

      function showMessage(title, text, buttonText) {
        running = false;
        messageTitle.textContent = title;
        messageText.textContent = text;
        startButton.textContent = buttonText;
        message.hidden = false;
      }

      function startGame() {
        resetGame();
        message.hidden = true;
        running = true;
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }

      function intersects(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function update(dt) {
        elapsed += dt;
        invulnerable = Math.max(0, invulnerable - dt);
        particles = particles.filter((particle) => {
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 420 * dt;
          return particle.life > 0;
        });
        const left = keys.has("ArrowLeft") || keys.has("KeyA");
        const right = keys.has("ArrowRight") || keys.has("KeyD");
        player.vx = (Number(right) - Number(left)) * 270;
        const wasGrounded = player.grounded;

        if ((keys.has("Space") || keys.has("ArrowUp") || keys.has("KeyW")) && player.grounded) {
          spawnParticles(player.x + player.w / 2, player.y + player.h, 8, "#fff1b0", 95, 25);
          player.vy = -650;
          player.grounded = false;
        }

        const oldX = player.x;
        player.x = Math.max(0, Math.min(worldWidth - player.w, player.x + player.vx * dt));
        for (const platform of platforms) {
          if (intersects(player, platform) && player.y + player.h > platform.y + 8) {
            player.x = oldX;
            break;
          }
        }

        const oldBottom = player.y + player.h;
        player.vy = Math.min(900, player.vy + 1750 * dt);
        player.y += player.vy * dt;
        player.grounded = false;
        for (const platform of platforms) {
          if (player.vy >= 0 && oldBottom <= platform.y && player.y + player.h >= platform.y &&
              player.x + player.w > platform.x && player.x < platform.x + platform.w) {
            player.y = platform.y - player.h;
            player.vy = 0;
            player.grounded = true;
            if (!wasGrounded) {
              spawnParticles(player.x + player.w / 2, platform.y, 10, "#d8f1a4", 120, 35);
            }
          }
        }

        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const enemy = enemies[i];
          enemy.x += enemy.direction * 75 * dt;
          if (enemy.x < enemy.min || enemy.x + enemy.w > enemy.max) enemy.direction *= -1;
          if (!intersects(player, enemy)) continue;

          if (player.vy >= 0 && oldBottom <= enemy.y + 10 && player.y + player.h >= enemy.y) {
            player.y = enemy.y - player.h;
            player.vy = -430;
            player.grounded = false;
            enemies.splice(i, 1);
            defeats += 1;
            spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, 14, "#f6d365", 110, 45);
            updateHud();
            continue;
          }

          if (invulnerable === 0) {
            lives -= 1;
            invulnerable = 1.2;
            player.x = Math.max(0, player.x - 90);
            player.vy = -300;
            updateHud();
            if (lives <= 0) {
              showMessage("もう一度チャレンジ！", "敵にぶつかってしまった。足場を見ながら進もう。", "リトライ");
              return;
            }
          }
        }

        if (player.y > worldHeight + 30) {
          showMessage("落ちてしまった！", "ジャンプのタイミングを変えて、もう一度進もう。", "リトライ");
          return;
        }
        if (player.x > worldWidth - 120) {
          showMessage("ゴール！", `冒険クリア！ ${defeats}体のモンスターを倒した！ タイムは ${elapsed.toFixed(1)} 秒。`, "もう一度遊ぶ");
          return;
        }

        const viewWidth = canvas.clientWidth;
        cameraX = Math.max(0, Math.min(worldWidth - viewWidth, player.x - viewWidth * 0.36));
        updateHud();
      }

      function draw() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (!width || !height) return;
        const scale = height / worldHeight;
        const viewWidth = width / scale;
        cameraX = Math.max(0, Math.min(worldWidth - viewWidth, cameraX));
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.scale(scale, scale);
        ctx.translate(-cameraX, 0);

        const sky = ctx.createLinearGradient(0, 0, 0, worldHeight);
        sky.addColorStop(0, "#312344");
        sky.addColorStop(0.58, "#51405b");
        sky.addColorStop(1, "#8a5962");
        ctx.fillStyle = sky;
        ctx.fillRect(cameraX, 0, viewWidth, worldHeight);

        drawStars(cameraX, viewWidth);
        drawParallax(viewWidth);
        for (let i = 0; i < 9; i += 1) {
          const x = i * 380 + 50 - (cameraX * 0.22) % 380;
          drawCloud(x, 95 + (i % 3) * 52);
        }

        ctx.fillStyle = "#58405b";
        ctx.beginPath();
        ctx.moveTo(cameraX, 435);
        for (let x = Math.floor(cameraX / 260) * 260; x <= cameraX + viewWidth + 300; x += 260) {
          ctx.quadraticCurveTo(x + 130, 330 + (Math.floor(x / 260) % 2) * 35, x + 260, 435);
        }
        ctx.lineTo(cameraX + viewWidth, worldHeight);
        ctx.lineTo(cameraX, worldHeight);
        ctx.fill();

        for (const platform of platforms) {
          ctx.fillStyle = "#70445a";
          ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
          ctx.fillStyle = "#80a85a";
          ctx.fillRect(platform.x, platform.y, platform.w, 8);
          ctx.fillStyle = "#bfd17a";
          for (let x = platform.x + 8; x < platform.x + platform.w; x += 24) {
            ctx.fillRect(x, platform.y + 8, 4, 4);
          }
          ctx.save();
          ctx.beginPath();
          ctx.rect(platform.x, platform.y + 15, platform.w, platform.h - 15);
          ctx.clip();
          for (let x = platform.x + 22; x < platform.x + platform.w - 14; x += 68) {
            const offset = Math.floor(x / 68) % 2 ? 12 : 0;
            ctx.fillStyle = "#51354c";
            ctx.fillRect(x + 5, platform.y + 26 + offset, 20, 8);
            ctx.fillStyle = "#9b665d";
            ctx.fillRect(x + 9, platform.y + 22 + offset, 12, 4);
            ctx.fillStyle = "#392c45";
            ctx.fillRect(x + 32, platform.y + 46 - offset / 2, 16, 7);
          }
          ctx.restore();
        }

        drawGoal();
        for (const enemy of enemies) drawEnemy(enemy);
        drawParticles();
        if (invulnerable === 0 || Math.floor(performance.now() / 90) % 2 === 0) drawPlayer();

        ctx.restore();
      }

      function drawStars(viewX, viewWidth) {
        for (let x = Math.floor(viewX / 96) * 96; x < viewX + viewWidth + 96; x += 96) {
          for (let row = 0; row < 4; row += 1) {
            const seed = Math.abs(Math.sin(x * 12.9898 + row * 78.233));
            const starX = x + seed * 82;
            const starY = 24 + row * 61 + Math.abs(Math.sin(x * 0.03 + row)) * 25;
            ctx.fillStyle = row % 2 ? "#e4b567" : "#fff0c2";
            const size = seed > 0.76 ? 4 : 2;
            ctx.fillRect(Math.floor(starX / 3) * 3, Math.floor(starY / 3) * 3, size, size);
          }
        }
      }

      function drawParallax(viewWidth) {
        const layers = [
          { speed: 0.12, y: 390, step: 340, color: "#44364f" },
          { speed: 0.28, y: 415, step: 250, color: "#58405b" }
        ];
        for (const layer of layers) {
          const offset = cameraX * layer.speed;
          ctx.save();
          ctx.translate(-offset, 0);
          ctx.fillStyle = layer.color;
          ctx.beginPath();
          ctx.moveTo(offset, layer.y + 70);
          for (let x = Math.floor(offset / layer.step) * layer.step; x <= offset + viewWidth + layer.step; x += layer.step) {
            ctx.lineTo(x + layer.step * 0.48, layer.y - (x / layer.step % 2 ? 42 : 12));
            ctx.lineTo(x + layer.step, layer.y + 70);
          }
          ctx.lineTo(offset + viewWidth, worldHeight);
          ctx.lineTo(offset, worldHeight);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        const islandOffset = cameraX * 0.38;
        ctx.save();
        ctx.translate(-islandOffset, 0);
        for (let x = Math.floor(islandOffset / 520) * 520 + 190; x < islandOffset + viewWidth + 520; x += 520) {
          const y = 248 + Math.sin(x) * 14;
          ctx.fillStyle = "#d79a68";
          ctx.beginPath();
          ctx.moveTo(x - 34, y + 2);
          ctx.lineTo(x + 34, y + 2);
          ctx.lineTo(x + 15, y + 18);
          ctx.lineTo(x + 5, y + 34);
          ctx.lineTo(x - 12, y + 17);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawCloud(x, y) {
        ctx.fillStyle = "#d9b9a3";
        ctx.fillRect(x, y + 12, 52, 16);
        ctx.fillRect(x + 12, y + 2, 28, 12);
        ctx.fillStyle = "#f0d4ae";
        ctx.fillRect(x + 7, y + 14, 36, 5);
      }

      function drawPlayer() {
        const moving = player.grounded && Math.abs(player.vx) > 0;
        const step = moving ? Math.sin(elapsed * 18) * 4 : 0;
        const bob = player.grounded ? (moving ? Math.abs(step) * -0.45 : 0) : -2;
        const x = player.x;
        const y = player.y + bob;
        const jumpPose = player.grounded ? 0 : Math.min(1, Math.abs(player.vy) / 650);
        ctx.fillStyle = "#15152688";
        ctx.beginPath();
        ctx.fillRect(x + 4, player.y + player.h, 24, 4);
        ctx.fill();
        ctx.fillStyle = "#334c83";
        ctx.beginPath();
        ctx.rect(x + 4, y + 17, 22, 22);
        ctx.fill();
        ctx.fillStyle = "#55759a";
        ctx.fillRect(x + 5, y + 25, 4, 12);
        ctx.fillStyle = "#a64f5b";
        ctx.beginPath();
        ctx.moveTo(x + 7, y + 19);
        ctx.lineTo(x - 1 + Math.round(Math.sin(elapsed * 9)) * 2, y + 30);
        ctx.lineTo(x + 12, y + 27);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#e9ad76";
        ctx.beginPath();
        ctx.rect(x + 7, y + 4, 18, 16);
        ctx.fill();
        ctx.fillStyle = "#65445c";
        ctx.beginPath();
        ctx.rect(x + 7, y + 3, 18, 7);
        ctx.rect(x + 4, y + 8, 23, 3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#e4b567";
        ctx.fillRect(x + 4, y + 7, 23, 3);
        ctx.fillStyle = "#fff0c2";
        ctx.fillRect(x + 19, y + 12, 4, 4);
        ctx.fillStyle = "#243044";
        ctx.fillRect(x + 20, y + 13, 2, 3);
        ctx.fillStyle = "#b98262";
        ctx.fillRect(x + 7, y + 23, 4, 7 - jumpPose * 2);
        ctx.fillRect(x + 24, y + 23, 4, 5 - jumpPose * 2);
        ctx.fillStyle = "#a64f5b";
        ctx.fillRect(x + 5, y + 37 + Math.max(0, step), 10, 5);
        ctx.fillRect(x + 18, y + 37 + Math.max(0, -step), 10, 5);
        ctx.fillStyle = "#f6d365";
        ctx.fillRect(x + 11, y + 20, 9, 3);
        ctx.fillStyle = "#d98064";
        ctx.fillRect(x + 15, y + 27, 3, 2);
      }

      function spawnParticles(x, y, count, color, spread, upwardSpeed) {
        for (let i = 0; i < count; i += 1) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * spread * 2,
            vy: -Math.random() * 100 - upwardSpeed,
            life: 0.35 + Math.random() * 0.3,
            maxLife: 0.65,
            size: 2 + Math.random() * 3,
            color
          });
        }
      }

      function drawParticles() {
        for (const particle of particles) {
          ctx.globalAlpha = particle.life / particle.maxLife;
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawEnemy(enemy) {
        const palettes = [
          { body: "#c65b62", light: "#e98b70", dark: "#713c58", horn: "#f6d365" },
          { body: "#7965a8", light: "#b69ac0", dark: "#443d70", horn: "#9dbd8a" },
          { body: "#d8894f", light: "#f0bd72", dark: "#8a4b4c", horn: "#f6d365" }
        ];
        const palette = palettes[enemy.type];
        const bob = Math.sin(elapsed * 5 + enemy.x * 0.02) * 2;
        const x = enemy.x;
        const y = enemy.y + bob;
        ctx.fillStyle = "#15152688";
        ctx.beginPath();
        ctx.fillRect(x + 3, enemy.y + enemy.h + 1, 26, 4);
        ctx.fill();
        ctx.fillStyle = palette.dark;
        ctx.beginPath();
        ctx.moveTo(x + 7, y + 12);
        ctx.lineTo(x + 3, y + 2);
        ctx.lineTo(x + 14, y + 8);
        ctx.moveTo(x + 19, y + 11);
        ctx.lineTo(x + 20, y + 8);
        ctx.lineTo(x + 26, y + 14);
        ctx.fill();
        ctx.fillStyle = palette.body;
        ctx.fillRect(x + 3, y + 12, 26, 13);
        ctx.fillRect(x + 7, y + 8, 18, 18);
        ctx.fillRect(x + 5, y + 25, 6, 4);
        ctx.fillRect(x + 14, y + 25, 6, 4);
        ctx.fillRect(x + 23, y + 25, 6, 4);
        ctx.fillStyle = palette.light;
        ctx.fillRect(x + 8, y + 11, 5, 3);
        ctx.fillRect(x + 20, y + 11, 5, 3);
        ctx.fillStyle = "#fff4e8";
        ctx.fillRect(x + 9, y + 16, 5, 6);
        ctx.fillRect(x + 20, y + 16, 5, 6);
        ctx.fillStyle = palette.dark;
        ctx.fillRect(x + 11, y + 18, 2, 3);
        ctx.fillRect(x + 22, y + 18, 2, 3);
        ctx.fillStyle = palette.horn;
        ctx.fillRect(x + 15, y + 25, 3, 3);
      }

      function drawGoal() {
        ctx.fillStyle = "#e4b567";
        ctx.fillRect(worldWidth - 125, 322, 6, 118);
        ctx.fillStyle = "#c65b62";
        ctx.beginPath();
        ctx.moveTo(worldWidth - 118, 325);
        ctx.lineTo(worldWidth - 62, 341);
        ctx.lineTo(worldWidth - 118, 360);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#f6d365";
        ctx.beginPath();
        ctx.arc(worldWidth - 121.5, 319, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop(time) {
        if (!running) return;
        const dt = Math.min((time - lastTime) / 1000, 0.04);
        lastTime = time;
        update(dt);
        draw();
        if (running) requestAnimationFrame(loop);
      }

      startButton.addEventListener("click", startGame);
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(event.code)) event.preventDefault();
        keys.add(event.code);
      });
      window.addEventListener("keyup", (event) => keys.delete(event.code));
      window.addEventListener("blur", () => keys.clear());

      document.querySelectorAll("[data-key]").forEach((button) => {
        const key = button.dataset.key;
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          keys.add(key);
        });
        button.addEventListener("pointerup", () => keys.delete(key));
        button.addEventListener("pointercancel", () => keys.delete(key));
        button.addEventListener("lostpointercapture", () => keys.delete(key));
      });

      resetGame();
      resizeCanvas();
    })();
  </script>
</body>
</html>
