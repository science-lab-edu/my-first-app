<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a35">
  <title>Skybound - ちいさな冒険</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b20;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, #29205c 0, transparent 55%),
        radial-gradient(ellipse at 85% 80%, #102c49 0, transparent 42%),
        #080b20;
    }

    main { width: min(100%, 960px); }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin: 0 2px 14px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #91a8db;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2rem);
      letter-spacing: -.04em;
    }

    .hint {
      margin: 0;
      color: #b5c3e3;
      font-size: .85rem;
      text-align: right;
    }

    .game-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid #4a58a8;
      border-radius: 18px;
      background: #11122f;
      box-shadow: 0 0 0 1px #42f5e933, 0 0 28px #42f5e933, 0 24px 80px #050b1c99;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      touch-action: none;
    }

    .hud {
      position: absolute;
      inset: 14px 16px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      color: #e9faff;
      font-size: .78rem;
      font-weight: 800;
      text-shadow: 0 0 9px #42f5e9b3;
    }

    .hud span {
      padding: 7px 11px;
      border: 1px solid #52f6e999;
      border-radius: 999px;
      background: #101c3bdb;
      box-shadow: 0 0 14px #42f5e933, inset 0 0 12px #42f5e90d;
      backdrop-filter: blur(8px);
    }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080b20b8;
      text-align: center;
    }

    .message[hidden] { display: none; }

    .card {
      max-width: 360px;
      padding: 25px 28px;
      border: 1px solid #42f5e977;
      border-radius: 18px;
      background: #10152eee;
      box-shadow: 0 0 24px #a14cff55, 0 14px 50px #08112699;
    }

    .card h2 { margin: 0 0 8px; color: #80fff1; font-size: 1.6rem; text-shadow: 0 0 14px #42f5e9a6; }
    .card p { margin: 0 0 18px; color: #c7d6f4; line-height: 1.6; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 20px;
      background: #42f5e9;
      color: #09142c;
      box-shadow: 0 0 18px #42f5e980;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
    }

    button:hover { background: #8efff7; box-shadow: 0 0 26px #42f5e9cc; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .mobile-controls {
      display: none;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-group { display: flex; gap: 10px; }
    .mobile-controls button {
      width: 64px;
      height: 54px;
      padding: 0;
      border: 1px solid #42f5e988;
      background: #111b3a;
      color: white;
      font-size: 1.2rem;
      box-shadow: inset 0 0 16px #42f5e91a, 0 0 12px #42f5e922;
      touch-action: none;
    }

    .mobile-controls button:active { background: #243c6b; box-shadow: 0 0 18px #42f5e980; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 13px 3px 0;
      color: #8e9dc6;
      font-size: .76rem;
    }

    @media (max-width: 650px) {
      body { padding: 18px 12px; }
      .topline { align-items: start; flex-direction: column; gap: 6px; }
      .hint { text-align: left; }
      .mobile-controls { display: flex; }
      .footer { font-size: .69rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topline">
      <div>
        <p class="eyebrow">A tiny platform adventure</p>
        <h1>Skybound <span aria-hidden="true">☁️</span></h1>
      </div>
      <p class="hint">足場をわたり、旗のところまで進もう。</p>
    </header>

    <section class="game-shell" aria-label="横スクロールアクションゲーム">
      <canvas id="game" aria-label="Skyboundのゲーム画面"></canvas>
      <div class="hud" aria-live="polite">
        <span id="progress">▶ START</span>
        <span id="lives">♥ ♥ ♥</span>
      </div>
      <div class="message" id="message">
        <div class="card">
          <h2 id="message-title">冒険に出発！</h2>
          <p id="message-text">ジャンプで足場をわたり、ゴールの旗を目指そう。</p>
          <button id="start-button" type="button">ゲームスタート</button>
        </div>
      </div>
    </section>

    <nav class="mobile-controls" aria-label="タッチ操作">
      <div class="control-group">
        <button type="button" data-key="ArrowLeft" aria-label="左へ">←</button>
        <button type="button" data-key="ArrowRight" aria-label="右へ">→</button>
      </div>
      <button type="button" data-key="Space" aria-label="ジャンプ">↑</button>
    </nav>

    <div class="footer">
      <span>操作: ← → / A D で移動 · Space / ↑ でジャンプ</span>
      <span>敵に触れるとライフが減ります</span>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const message = document.querySelector("#message");
      const messageTitle = document.querySelector("#message-title");
      const messageText = document.querySelector("#message-text");
      const startButton = document.querySelector("#start-button");
      const progressLabel = document.querySelector("#progress");
      const livesLabel = document.querySelector("#lives");

      const worldWidth = 2800;
      const worldHeight = 540;
      const platforms = [
        { x: 0, y: 440, w: 500, h: 100 },
        { x: 590, y: 440, w: 390, h: 100 },
        { x: 1080, y: 440, w: 390, h: 100 },
        { x: 1580, y: 440, w: 410, h: 100 },
        { x: 2110, y: 440, w: 690, h: 100 },
        { x: 250, y: 345, w: 150, h: 22 },
        { x: 720, y: 340, w: 150, h: 22 },
        { x: 1190, y: 335, w: 165, h: 22 },
        { x: 1690, y: 340, w: 150, h: 22 },
        { x: 2220, y: 330, w: 165, h: 22 }
      ];
      const enemySpawns = [
        { x: 360, y: 410, min: 300, max: 465 },
        { x: 805, y: 310, min: 720, max: 850 },
        { x: 1300, y: 410, min: 1130, max: 1410 },
        { x: 1780, y: 310, min: 1690, max: 1810 },
        { x: 2310, y: 300, min: 2220, max: 2360 },
        { x: 2630, y: 410, min: 2460, max: 2730 }
      ];
      const keys = new Set();
      const player = { x: 70, y: 390, w: 30, h: 42, vx: 0, vy: 0, grounded: false };
      let enemies = [];
      let cameraX = 0;
      let lives = 3;
      let running = false;
      let lastTime = 0;
      let elapsed = 0;
      let invulnerable = 0;
      let particles = [];

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(canvas.width / (rect.width || 1), 0, 0, canvas.height / (rect.height || 1), 0, 0);
        draw();
      }

      function resetGame() {
        player.x = 70;
        player.y = 390;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        cameraX = 0;
        lives = 3;
        invulnerable = 0;
        elapsed = 0;
        particles = [];
        enemies = enemySpawns.map((enemy, index) => ({
          ...enemy,
          x: enemy.x,
          y: enemy.y,
          w: 32,
          h: 30,
          type: index % 3,
          direction: index % 2 === 0 ? 1 : -1
        }));
        updateHud();
      }

      function updateHud() {
        progressLabel.textContent = `${Math.min(100, Math.floor((player.x / (worldWidth - 100)) * 100))}%`;
        livesLabel.textContent = `${"♥ ".repeat(lives)}${"♡ ".repeat(3 - lives)}`.trim();
      }

      function showMessage(title, text, buttonText) {
        running = false;
        messageTitle.textContent = title;
        messageText.textContent = text;
        startButton.textContent = buttonText;
        message.hidden = false;
      }

      function startGame() {
        resetGame();
        message.hidden = true;
        running = true;
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }

      function intersects(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function update(dt) {
        elapsed += dt;
        invulnerable = Math.max(0, invulnerable - dt);
        particles = particles.filter((particle) => {
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 420 * dt;
          return particle.life > 0;
        });
        const left = keys.has("ArrowLeft") || keys.has("KeyA");
        const right = keys.has("ArrowRight") || keys.has("KeyD");
        player.vx = (Number(right) - Number(left)) * 270;
        const wasGrounded = player.grounded;

        if ((keys.has("Space") || keys.has("ArrowUp") || keys.has("KeyW")) && player.grounded) {
          spawnParticles(player.x + player.w / 2, player.y + player.h, 8, "#fff1b0", 95, 25);
          player.vy = -650;
          player.grounded = false;
        }

        const oldX = player.x;
        player.x = Math.max(0, Math.min(worldWidth - player.w, player.x + player.vx * dt));
        for (const platform of platforms) {
          if (intersects(player, platform) && player.y + player.h > platform.y + 8) {
            player.x = oldX;
            break;
          }
        }

        const oldBottom = player.y + player.h;
        player.vy = Math.min(900, player.vy + 1750 * dt);
        player.y += player.vy * dt;
        player.grounded = false;
        for (const platform of platforms) {
          if (player.vy >= 0 && oldBottom <= platform.y && player.y + player.h >= platform.y &&
              player.x + player.w > platform.x && player.x < platform.x + platform.w) {
            player.y = platform.y - player.h;
            player.vy = 0;
            player.grounded = true;
            if (!wasGrounded) {
              spawnParticles(player.x + player.w / 2, platform.y, 10, "#d8f1a4", 120, 35);
            }
          }
        }

        for (const enemy of enemies) {
          enemy.x += enemy.direction * 75 * dt;
          if (enemy.x < enemy.min || enemy.x + enemy.w > enemy.max) enemy.direction *= -1;
          if (invulnerable === 0 && intersects(player, enemy)) {
            lives -= 1;
            invulnerable = 1.2;
            player.x = Math.max(0, player.x - 90);
            player.vy = -300;
            updateHud();
            if (lives <= 0) {
              showMessage("もう一度チャレンジ！", "敵にぶつかってしまった。足場を見ながら進もう。", "リトライ");
              return;
            }
          }
        }

        if (player.y > worldHeight + 30) {
          showMessage("落ちてしまった！", "ジャンプのタイミングを変えて、もう一度進もう。", "リトライ");
          return;
        }
        if (player.x > worldWidth - 120) {
          showMessage("ゴール！", `冒険クリア！ タイムは ${elapsed.toFixed(1)} 秒。`, "もう一度遊ぶ");
          return;
        }

        const viewWidth = canvas.clientWidth;
        cameraX = Math.max(0, Math.min(worldWidth - viewWidth, player.x - viewWidth * 0.36));
        updateHud();
      }

      function draw() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (!width || !height) return;
        const scale = height / worldHeight;
        const viewWidth = width / scale;
        cameraX = Math.max(0, Math.min(worldWidth - viewWidth, cameraX));
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.scale(scale, scale);
        ctx.translate(-cameraX, 0);

        const sky = ctx.createLinearGradient(0, 0, 0, worldHeight);
        sky.addColorStop(0, "#111638");
        sky.addColorStop(0.58, "#24204e");
        sky.addColorStop(1, "#382451");
        ctx.fillStyle = sky;
        ctx.fillRect(cameraX, 0, viewWidth, worldHeight);

        drawStars(cameraX, viewWidth);
        drawParallax(viewWidth);
        for (let i = 0; i < 9; i += 1) {
          const x = i * 380 + 50 - (cameraX * 0.22) % 380;
          drawCloud(x, 95 + (i % 3) * 52);
        }

        ctx.fillStyle = "#202c5c";
        ctx.beginPath();
        ctx.moveTo(cameraX, 435);
        for (let x = Math.floor(cameraX / 260) * 260; x <= cameraX + viewWidth + 300; x += 260) {
          ctx.quadraticCurveTo(x + 130, 330 + (Math.floor(x / 260) % 2) * 35, x + 260, 435);
        }
        ctx.lineTo(cameraX + viewWidth, worldHeight);
        ctx.lineTo(cameraX, worldHeight);
        ctx.fill();

        for (const platform of platforms) {
          const earth = ctx.createLinearGradient(0, platform.y, 0, platform.y + platform.h);
          earth.addColorStop(0, "#303469");
          earth.addColorStop(1, "#171b3b");
          ctx.fillStyle = earth;
          ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
          ctx.fillStyle = "#42f5e9";
          ctx.shadowColor = "#42f5e9";
          ctx.shadowBlur = 14;
          ctx.fillRect(platform.x, platform.y, platform.w, 4);
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#b44cff";
          ctx.fillRect(platform.x, platform.y + 5, platform.w, 4);
          ctx.fillStyle = "#82fff4";
          for (let x = platform.x + 12; x < platform.x + platform.w; x += 34) {
            ctx.fillRect(x, platform.y + 9, 3, 4);
            ctx.fillRect(x + 5, platform.y + 13, 2, 3);
          }
          ctx.save();
          ctx.beginPath();
          ctx.rect(platform.x, platform.y + 15, platform.w, platform.h - 15);
          ctx.clip();
          for (let x = platform.x + 22; x < platform.x + platform.w - 14; x += 68) {
            const offset = Math.floor(x / 68) % 2 ? 12 : 0;
            ctx.fillStyle = "#22284d";
            ctx.beginPath();
            ctx.ellipse(x + 14, platform.y + 31 + offset, 14, 7, -0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#73509f";
            ctx.beginPath();
            ctx.ellipse(x + 12, platform.y + 29 + offset, 9, 3, -0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#141a39";
            ctx.beginPath();
            ctx.ellipse(x + 39, platform.y + 53 - offset / 2, 10, 5, 0.12, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        drawGoal();
        for (const enemy of enemies) drawEnemy(enemy);
        drawParticles();
        if (invulnerable === 0 || Math.floor(performance.now() / 90) % 2 === 0) drawPlayer();

        ctx.restore();
      }

      function drawStars(viewX, viewWidth) {
        for (let x = Math.floor(viewX / 96) * 96; x < viewX + viewWidth + 96; x += 96) {
          for (let row = 0; row < 4; row += 1) {
            const seed = Math.abs(Math.sin(x * 12.9898 + row * 78.233));
            const starX = x + seed * 82;
            const starY = 24 + row * 61 + Math.abs(Math.sin(x * 0.03 + row)) * 25;
            const pulse = 0.45 + Math.sin(elapsed * 2 + seed * 8) * 0.2;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = row % 2 ? "#b991ff" : "#9bfff4";
            ctx.beginPath();
            ctx.arc(starX, starY, 1 + seed * 1.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawParallax(viewWidth) {
        const layers = [
          { speed: 0.12, y: 390, step: 340, color: "#24275a" },
          { speed: 0.28, y: 415, step: 250, color: "#30316c" }
        ];
        for (const layer of layers) {
          const offset = cameraX * layer.speed;
          ctx.save();
          ctx.translate(-offset, 0);
          ctx.fillStyle = layer.color;
          ctx.beginPath();
          ctx.moveTo(offset, layer.y + 70);
          for (let x = Math.floor(offset / layer.step) * layer.step; x <= offset + viewWidth + layer.step; x += layer.step) {
            ctx.lineTo(x + layer.step * 0.48, layer.y - (x / layer.step % 2 ? 42 : 12));
            ctx.lineTo(x + layer.step, layer.y + 70);
          }
          ctx.lineTo(offset + viewWidth, worldHeight);
          ctx.lineTo(offset, worldHeight);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        const islandOffset = cameraX * 0.38;
        ctx.save();
        ctx.translate(-islandOffset, 0);
        for (let x = Math.floor(islandOffset / 520) * 520 + 190; x < islandOffset + viewWidth + 520; x += 520) {
          const y = 248 + Math.sin(x) * 14;
          ctx.fillStyle = "#a14cff33";
          ctx.beginPath();
          ctx.ellipse(x, y, 42, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#4d4b91";
          ctx.beginPath();
          ctx.moveTo(x - 34, y + 2);
          ctx.lineTo(x + 34, y + 2);
          ctx.lineTo(x + 15, y + 18);
          ctx.lineTo(x + 5, y + 34);
          ctx.lineTo(x - 12, y + 17);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawCloud(x, y) {
        ctx.fillStyle = "#c0b4ff99";
        ctx.beginPath();
        ctx.arc(x, y + 15, 21, 0, Math.PI * 2);
        ctx.arc(x + 25, y, 27, 0, Math.PI * 2);
        ctx.arc(x + 53, y + 15, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPlayer() {
        const moving = player.grounded && Math.abs(player.vx) > 0;
        const step = moving ? Math.sin(elapsed * 18) * 4 : 0;
        const bob = player.grounded ? (moving ? Math.abs(step) * -0.45 : 0) : -2;
        const x = player.x;
        const y = player.y + bob;
        const jumpPose = player.grounded ? 0 : Math.min(1, Math.abs(player.vy) / 650);
        ctx.fillStyle = "#42f5e966";
        ctx.beginPath();
        ctx.ellipse(x + player.w / 2, player.y + player.h + 2, 18, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = "#42f5e9";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#172950";
        ctx.beginPath();
        ctx.roundRect(x + 4, y + 17, 22, 22, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#42f5e9";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#476cbb";
        ctx.fillRect(x + 5, y + 25, 4, 12);
        ctx.fillStyle = "#ff4d9d";
        ctx.beginPath();
        ctx.moveTo(x + 7, y + 19);
        ctx.quadraticCurveTo(x - 1, y + 24, x + 3 + Math.sin(elapsed * 9) * 2, y + 31);
        ctx.lineTo(x + 12, y + 27);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#f4bd76";
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 12, 10, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#7c51c7";
        ctx.beginPath();
        ctx.arc(x + 17, y + 10, 9, Math.PI, Math.PI * 2);
        ctx.lineTo(x + 25, y + 13);
        ctx.quadraticCurveTo(x + 16, y + 9, x + 8, y + 14);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#42f5e9";
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 8, 12, 3, -0.08, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x + 20, y + 13, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#243044";
        ctx.beginPath();
        ctx.arc(x + 21, y + 13, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#9bfff4";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 8, y + 23);
        ctx.lineTo(x + 3, y + 27 - jumpPose * 3);
        ctx.moveTo(x + 24, y + 23);
        ctx.lineTo(x + 28, y + 26 - jumpPose * 3);
        ctx.stroke();
        ctx.fillStyle = "#ff4d9d";
        ctx.beginPath();
        ctx.ellipse(x + 9, y + 40 + Math.max(0, step), 7, 3, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 22, y + 40 + Math.max(0, -step), 7, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffe27a";
        ctx.fillRect(x + 11, y + 20, 9, 3);
        ctx.fillStyle = "#f4bd76";
        ctx.beginPath();
        ctx.arc(x + 16, y + 27, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      function spawnParticles(x, y, count, color, spread, upwardSpeed) {
        for (let i = 0; i < count; i += 1) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * spread * 2,
            vy: -Math.random() * 100 - upwardSpeed,
            life: 0.35 + Math.random() * 0.3,
            maxLife: 0.65,
            size: 2 + Math.random() * 3,
            color
          });
        }
      }

      function drawParticles() {
        for (const particle of particles) {
          ctx.globalAlpha = particle.life / particle.maxLife;
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawEnemy(enemy) {
        const palettes = [
          { body: "#ff397a", light: "#ff9ac5", dark: "#7e255d", horn: "#ffe65c" },
          { body: "#9b55ff", light: "#d4a5ff", dark: "#512f9a", horn: "#5ffff0" },
          { body: "#ff873d", light: "#ffd17b", dark: "#a63f63", horn: "#ffef70" }
        ];
        const palette = palettes[enemy.type];
        const bob = Math.sin(elapsed * 5 + enemy.x * 0.02) * 2;
        const x = enemy.x;
        const y = enemy.y + bob;
        ctx.fillStyle = "#ff4d9d55";
        ctx.beginPath();
        ctx.ellipse(x + enemy.w / 2, enemy.y + enemy.h + 3, 17, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = palette.light;
        ctx.shadowBlur = 16;
        ctx.fillStyle = palette.dark;
        ctx.beginPath();
        ctx.moveTo(x + 7, y + 12);
        ctx.lineTo(x + 3, y + 2);
        ctx.quadraticCurveTo(x + 13, y + 3, x + 14, y + 11);
        ctx.moveTo(x + 19, y + 11);
        ctx.quadraticCurveTo(x + 21, y + 3, x + 30, y + 2);
        ctx.lineTo(x + 26, y + 14);
        ctx.fill();
        ctx.fillStyle = palette.body;
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 18, 15, 12, 0, Math.PI, Math.PI * 2);
        ctx.lineTo(x + 31, y + 25);
        ctx.quadraticCurveTo(x + 28, y + 31, x + 24, y + 27);
        ctx.quadraticCurveTo(x + 18, y + 32, x + 13, y + 27);
        ctx.quadraticCurveTo(x + 7, y + 32, x + 2, y + 25);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = palette.light;
        ctx.beginPath();
        ctx.ellipse(x + 11, y + 13, 5, 3, -0.4, 0, Math.PI * 2);
        ctx.ellipse(x + 22, y + 13, 5, 3, 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff4e8";
        ctx.beginPath();
        ctx.ellipse(x + 11, y + 19, 4, 5, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 22, y + 19, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = palette.dark;
        ctx.beginPath();
        ctx.arc(x + 12, y + 20, 1.7, 0, Math.PI * 2);
        ctx.arc(x + 23, y + 20, 1.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = palette.horn;
        ctx.beginPath();
        ctx.arc(x + 16, y + 27, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function drawGoal() {
        ctx.shadowColor = "#42f5e9";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#a9fff9";
        ctx.fillRect(worldWidth - 125, 322, 7, 118);
        ctx.fillStyle = "#ff4d9d";
        ctx.beginPath();
        ctx.moveTo(worldWidth - 118, 325);
        ctx.lineTo(worldWidth - 62, 341);
        ctx.lineTo(worldWidth - 118, 360);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffe65c";
        ctx.beginPath();
        ctx.arc(worldWidth - 121.5, 319, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop(time) {
        if (!running) return;
        const dt = Math.min((time - lastTime) / 1000, 0.04);
        lastTime = time;
        update(dt);
        draw();
        if (running) requestAnimationFrame(loop);
      }

      startButton.addEventListener("click", startGame);
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(event.code)) event.preventDefault();
        keys.add(event.code);
      });
      window.addEventListener("keyup", (event) => keys.delete(event.code));
      window.addEventListener("blur", () => keys.clear());

      document.querySelectorAll("[data-key]").forEach((button) => {
        const key = button.dataset.key;
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          keys.add(key);
        });
        button.addEventListener("pointerup", () => keys.delete(key));
        button.addEventListener("pointercancel", () => keys.delete(key));
        button.addEventListener("lostpointercapture", () => keys.delete(key));
      });

      resetGame();
      resizeCanvas();
    })();
  </script>
</body>
</html>
